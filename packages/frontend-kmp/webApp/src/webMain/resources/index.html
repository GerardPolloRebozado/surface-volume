<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Surface Volume — connect your services and keep your workflows running.">
    <meta name="theme-color" content="#faf9f7">
    <!-- Optional deploy-time override: <meta name="api-base-url" content="http://host:port"> -->
    <title>Surface Volume — workflow automation</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation" aria-hidden="true">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <noscript>Surface Volume needs JavaScript (WebAssembly) enabled to run.</noscript>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
