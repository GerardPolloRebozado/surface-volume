[package]
name = "runner-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
bullmq-official = "1.5.2"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
opentelemetry = { version = "0.33", features = ["metrics", "trace", "logs"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics", "logs", "trace"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "metrics", "logs", "trace"] }
opentelemetry-appender-tracing = "0.33"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
