global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules are defined in Grafana (provisioning/alerting/rules.yml) so they
# are visible and editable in the in-app Alerting UI. No Alertmanager here.
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
