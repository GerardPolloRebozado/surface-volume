name: Generate API Client

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/backend-nestjs/**"
      - "scripts/generate-api-client.sh"
  pull_request:
    paths:
      - "packages/backend-nestjs/**"
      - "scripts/generate-api-client.sh"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # NOTE: the OpenAPI schema cannot be generated without a database and Redis.
    # The NestJS app won't bootstrap without them:
    #   - PrismaService.onModuleInit() calls await this.$connect()  (needs Postgres)
    #   - BullModule.forRoot() / BullModule.registerQueue() connect to Redis
    #   - SwaggerModule.createDocument() needs the fully-initialised app
    # So instead of skipping them, we spin up throwaway Docker containers for
    # postgres + redis via GitHub Actions service containers, run the backend to
    # emit openapi.json, and GitHub Actions automatically stops/removes the
    # service containers when the job finishes (success or failure).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surface_volume
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surface_volume?schema=public
      DISABLE_CRONS: "1"
      INTERNAL_SERVICE_TOKEN: ci-token
      JWT_SECRET: ci-secret-at-least-32-bytes-long-for-jwt-signing
      APP_URL: http://localhost:8080
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install backend dependencies
        run: |
          cd packages/backend-nestjs
          pnpm install --strict-peer-dependencies=false

      - name: Generate Prisma client
        run: |
          cd packages/backend-nestjs
          pnpm prisma generate

      - name: Build NestJS backend
        run: |
          cd packages/backend-nestjs
          pnpm run build

      - name: Generate OpenAPI JSON
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd packages/backend-nestjs
          # Start NestJS in background to serve OpenAPI spec
          pnpm run start:dev &
          BACKEND_PID=$!
          sleep 15

          # Fetch OpenAPI JSON from running server
          curl -s http://localhost:8080/api-json > packages/backend-nestjs/openapi.json

          # Stop backend
          kill $BACKEND_PID 2>/dev/null || true

          echo "OpenAPI JSON generated at packages/backend-nestjs/openapi.json"
          head -20 packages/backend-nestjs/openapi.json

      - name: Generate Kotlin and TypeScript API clients
        run: |
          chmod +x scripts/generate-api-client.sh
          bash scripts/generate-api-client.sh

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet packages/api-client-kt/ packages/api-client-ts/ packages/backend-nestjs/openapi.json || echo "changes_detected=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated clients
        if: github.event_name == 'push' && steps.changes.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/api-client-kt/ packages/api-client-ts/ packages/backend-nestjs/openapi.json
          git commit -m "🤖 Generated Kotlin and TypeScript API clients from OpenAPI spec"
          git push
