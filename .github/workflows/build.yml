name: CI & Release Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    # Runs on any PR targeting any branch to ensure code builds and tests pass
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  # -----------------------------------------------------------------
  # 1. Determine Version & Release Metadata (runs on push to dev/main)
  # -----------------------------------------------------------------
  version:
    name: Determine SemVer & Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      release_version: ${{ steps.semantic.outputs.release_version }}
      release_tag: ${{ steps.semantic.outputs.release_tag }}
      is_prerelease: ${{ steps.semantic.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine Version
        id: semantic
        if: github.event_name == 'push'
        run: |
          CURRENT_BRANCH="${GITHUB_REF_NAME}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}

          COMMITS=$(git log "${LATEST_TAG}..HEAD" --oneline 2>/dev/null || git log -n 50 --oneline)
          
          # Check for breaking change, feat, fix
          if echo "$COMMITS" | grep -Ei "BREAKING CHANGE|!:|breaking:"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMITS" | grep -Ei "^[a-f0-9]+ feat(\(.*\))?:"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif echo "$COMMITS" | grep -Ei "^[a-f0-9]+ fix(\(.*\))?:"; then
            PATCH=$((PATCH + 1))
          else
            PATCH=$((PATCH + 1))
          fi

          if [ "$CURRENT_BRANCH" = "dev" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            RELEASE_TAG="v${MAJOR}.${MINOR}.${PATCH}-dev.${SHORT_SHA}"
            RELEASE_VERSION="${MAJOR}.${MINOR}.${PATCH}-dev.${SHORT_SHA}"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            RELEASE_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            RELEASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed tag: ${RELEASE_TAG} (Branch: ${CURRENT_BRANCH})"

  # -----------------------------------------------------------------
  # 2. Generate API Clients (ephemeral in CI for builds)
  # -----------------------------------------------------------------
  generate-clients:
    name: Generate API Clients
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surface_volume
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surface_volume?schema=public
      DISABLE_CRONS: "1"
      INTERNAL_SERVICE_TOKEN: ci-token
      JWT_SECRET: ci-secret-at-least-32-bytes-long-for-jwt-signing
      APP_URL: http://localhost:8080
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm 11.0.0
        uses: pnpm/action-setup@v6
        with:
          version: "11.0.0"

      - name: Install backend dependencies & build
        run: |
          cd packages/backend-nestjs
          pnpm install --strict-peer-dependencies=false
          pnpm prisma generate
          pnpm run build

      - name: Generate OpenAPI JSON & API Clients
        run: |
          cd packages/backend-nestjs
          pnpm run start:dev &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api-json -o openapi.json; then
              break
            fi
            sleep 1
          done
          kill $BACKEND_PID 2>/dev/null || true
          test -s openapi.json

          cd ../..
          chmod +x scripts/generate-api-client.sh
          # Set DOCKER_USER to current runner UID:GID so files are accessible
          DOCKER_USER="$(id -u):$(id -g)" bash scripts/generate-api-client.sh

      - name: Upload Generated API Clients
        uses: actions/upload-artifact@v4
        with:
          name: generated-api-clients
          path: |
            packages/api-client-ts
            packages/api-client-kt
          retention-days: 1

  # -----------------------------------------------------------------
  # 3. Build Backend Docker Container
  # -----------------------------------------------------------------
  build-backend:
    name: Backend Container
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=${{ needs.version.outputs.release_version }},enable=${{ needs.version.outputs.new_release_published == 'true' }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./packages/backend-nestjs
          file: ./packages/backend-nestjs/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev') }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------
  # 4. Build Web Docker Container
  # -----------------------------------------------------------------
  build-web:
    name: Web Container
    runs-on: ubuntu-latest
    needs: [version, generate-clients]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Generated API Clients
        uses: actions/download-artifact@v4
        with:
          name: generated-api-clients
          path: packages

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=${{ needs.version.outputs.release_version }},enable=${{ needs.version.outputs.new_release_published == 'true' }}

      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/web/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev') }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------
  # 5. Build Android APK
  # -----------------------------------------------------------------
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [version, generate-clients]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Generated API Clients
        uses: actions/download-artifact@v4
        with:
          name: generated-api-clients
          path: packages

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: packages/frontend-kmp

      - name: Grant execute permission for gradlew
        run: chmod +x packages/frontend-kmp/gradlew

      - name: Build Android APK
        run: |
          cd packages/frontend-kmp
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p build-artifacts
          cp packages/frontend-kmp/androidApp/build/outputs/apk/debug/*.apk build-artifacts/surface-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: surface-android-apk
          path: build-artifacts/surface-app.apk

  # -----------------------------------------------------------------
  # 6. Create GitHub Release (dev prerelease or main release)
  # -----------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-backend, build-web, build-android]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: surface-android-apk
          path: ./release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_tag }}
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ./release-artifacts/surface-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
