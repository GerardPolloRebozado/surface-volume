<ui-shell active="workflows"><div class="h-full flex flex-col" x-data="{ path: location.pathname }">

 <ui-bar heading-key="error.notFoundTitle">

 </ui-bar>

 <div class="flex-1 min-h-0 overflow-auto">

   <div class="text-center">
    <div class="text-[48px] font-mono leading-none mb-2">404</div>
    <h2 class="text-[16px] font-semibold" x-text="t('error.notFoundTitle')"></h2>
    <p class="text-[13px] text-mute leading-relaxed mt-1 max-w-[46ch] mx-auto" x-text="t('error.notFoundBody')"></p>
    <p class="text-[11px] text-mute font-mono mt-4" x-text="path"></p>
   </div>

   <div class="mt-10 grid grid-cols-1 sm:grid-cols-2 gap-4">

     <span class="ml-auto shrink-0" x-html="ICON('arrow-right','',15)"></span>
    </a>
    <a class="card p-5 flex items-center gap-3 hover:bg-fill transition-colors" href="services.html">
     <span class="shrink-0" x-html="ICON('bolt','',20)"></span>
     <div class="min-w-0 flex-1"><div class="text-[13px] font-semibold truncate" x-text="t('services.title')"></div><div class="text-[11px] text-mute">Connected services</div></div>
     <span class="ml-auto shrink-0" x-html="ICON('arrow-right','',15)"></span>
    </a>
   </div>
  </div>
 </div>

 <div id="polite-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
