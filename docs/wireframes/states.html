<!doctype html><html lang="en"><head><title>States · area</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cpath d='M7 19.5C7 13 12.5 7 19.5 7' fill='none' stroke='%231b6fc4' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='19.5' r='3.1' fill='%231b6fc4'/%3E%3Ccircle cx='19.5' cy='7' r='2.6' fill='%23fff' stroke='%231b6fc4' stroke-width='2'/%3E%3C/svg%3E"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="theme.js"></script><script src="data.js"></script><script defer src="components.js"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script><style>[x-cloak]{display:none!important}</style></head><body>
<ui-shell active="states"><div class="h-full flex flex-col" x-data="{
  q: '', loading: false,
  get state(){
    return [
      { key:'emptyWorkflows', tone:'neutral', icon:'layers', when:t('states.emptyWorkflowsWhen'), what:t('states.emptyWorkflowsWhat'), cta:t('dash.emptyCta'), href:'builder.html' },
      { key:'emptyRuns', tone:'neutral', icon:'activity', when:t('states.emptyRunsWhen'), what:t('states.emptyRunsWhat'), cta:t('dash.new'), href:'builder.html' },
      { key:'emptySearch', tone:'neutral', icon:'search', when:t('states.emptySearchWhen'), what:t('states.emptySearchWhat'), cta:t('dash.clearFilters'), href:'index.html' },
      { key:'expired', tone:'warn', icon:'alert', when:t('states.expiredWhen'), what:t('states.expiredWhat'), cta:t('dash.needsCta',{service:svc('notion').name}), href:'services.html?s=notion' },
      { key:'invalid', tone:'warn', icon:'alert', when:t('states.invalidWhen'), what:t('states.invalidWhat'), cta:t('common.open'), href:'builder.html' },
      { key:'conflict', tone:'warn', icon:'refresh', when:t('states.conflictWhen'), what:t('states.conflictWhat'), cta:'Reload', href:'#' },
      { key:'offline', tone:'bad', icon:'wifi-off', when:t('states.offlineWhen'), what:t('states.offlineWhat'), cta:'Reload', href:'#' },
      { key:'fieldError', tone:'bad', icon:'alert', when:t('states.fieldErrorWhen'), what:t('states.fieldErrorWhat'), cta:t('common.change'), href:'builder.html' },
      { key:'forbidden', tone:'bad', icon:'shield', when:t('states.forbiddenWhen'), what:t('states.forbiddenWhat'), cta:t('dash.listTitle'), href:'index.html' },
      { key:'notFound', tone:'bad', icon:'x', when:t('states.notFoundWhen'), what:t('states.notFoundWhat'), cta:t('services.back'), href:'services.html' },
      { key:'loading', tone:'accent', icon:'clock', when:t('states.loadingWhen'), what:t('states.loadingWhat'), cta:'', href:'#' },
      { key:'rate', tone:'warn', icon:'clock', when:t('states.rateWhen'), what:t('states.rateWhat'), cta:'Reload', href:'#' }
    ]
  },
  get list(){ const q=this.q.toLowerCase().trim(); return this.state.filter(s=>!q || (tx(s.when)+' '+tx(s.what)+' '+t(s.key)).toLowerCase().includes(q)) },
  reload(){ toast('Reloaded'); announce('Reloaded',true); },
  startLoading(){ this.loading=true; toast(t('states.loading')); announce(t('states.loading'),true); setTimeout(()=>this.loading=false,1400) }
}" class="h-full flex flex-col">

 <ui-bar heading-key="states.title" sub-key="states.lead">
  <div class="relative hidden sm:block">
   <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-faint" x-html="ICON('search','',15)"></span>
   <input x-model="q" class="input pl-8 w-[220px] text-[13px]" :placeholder="t('dash.searchPlaceholder')" :aria-label="t('dash.searchPlaceholder')" type="search">
  </div>
  <button type="button" class="btn btn-sm btn-ghost" @click="startLoading()" x-text="t('states.loading')"></button>
 </ui-bar>

 <div class="flex-1 overflow-auto scroll">
  <div class="max-w-[900px] mx-auto px-4 sm:px-6 lg:px-8 py-7 space-y-5">
   <div class="flex items-center justify-between">
    <h2 class="text-[13px] font-semibold uppercase tracking-[.08em] text-faint" x-text="t('dash.listTitle')"></h2>
    <span class="text-[11px] text-faint num" x-text="list.length"></span>
   </div>
   <template x-if="!list.length"><p class="text-[12px] text-mute py-6" x-text="t('dash.noMatch',{query:q})"></p></template>
   <div class="space-y-2">
    <template x-for="s in list" :key="s.key">
     <a :href="s.href" class="rowlink group">
      <div class="flex items-center gap-2.5">
       <div class="mt-0.5 shrink-0" x-html="ICON(s.icon,'',20)" :style="'color:var(--'+(s.tone==='ok'?'ok':s.tone==='warn'?'warn':s.tone==='bad'?'bad':'mute')+')'" aria-hidden="true"></div>
       <div class="min-w-0 flex-1">
        <div class="flex items-baseline gap-2">
         <div class="text-[12.5px] font-semibold truncate" x-text="t(s.key)"></div>
        </div>
        <div class="text-[11px] text-mute leading-snug" x-text="t(s.when)"></div>
       </div>
       <span class="ml-auto shrink-0" x-text="t('states.what')"></span>
      </div>
      <div class="flex items-end gap-2">
       <button type="button" class="btn btn-sm btn-ghost" @click.prevent="location=s.href" x-text="s.cta"></button>
      </div>
     </a>
     <div class="border-t border-line my-2"></div>
    </template>
   </div>
   <p class="text-[11px] text-faint py-6" x-text="t('states.back')"></p>
   <a class="mt-1 inline-block text-[11px] text-accent hover:underline" href="index.html" x-text="t('states.back')"></a>
  </div>
 </div>

 <div id="polite-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
 <div id="alert-live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
 <div id="toasts" role="region" :aria-label="t('common.help')"></div>
</div></ui-shell>
</body></html>
