name: surface-observability

# Deployed once, not with every app instance. The app reaches otel-collector
# over the shared surface-net network (or via OTEL_EXPORTER_OTLP_ENDPOINT).
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "${OTEL_HTTP_HOST_PORT:-4318}:4318"
      - "8889:8889"
    restart: unless-stopped
    networks:
      - surface-net

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../../observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_HOST_PORT:-3200}:3200"
    restart: unless-stopped
    networks:
      - surface-net

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    restart: unless-stopped
    networks:
      - surface-net

  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    restart: unless-stopped
    networks:
      - surface-net

  grafana:
    image: grafana/grafana:12.4.15
    env_file: ../../.env
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    restart: unless-stopped
    networks:
      - surface-net

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  surface-net:
    name: surface-net
    external: true
